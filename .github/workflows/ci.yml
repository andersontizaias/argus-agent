name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend: tests + coverage gate ──────────────────────────
  # fail_under=90 é aplicado por pyproject.toml's [tool.coverage.report] —
  # `uv run pytest` já sai não-zero sozinho se a cobertura cair abaixo disso.
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      # Gerada nova a cada run em vez de um valor estático neste arquivo —
      # uma chave Fernet fixa aqui dispara a regra de entropia genérica do
      # gitleaks (falso positivo real, mesmo caso do phalanx-agents).
      - name: Gerar ARGUS_SECRET_KEY efêmera só para teste
        run: echo "ARGUS_SECRET_KEY=$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - run: uv run playwright install --with-deps chromium
      # frontend/dist não existe neste job (só frontend-tests builda, em outro
      # runner sem filesystem compartilhado) — um stub mínimo (com img/logo.png)
      # é suficiente pra exercitar o mount/serve real do FastAPI que os testes
      # de main.py checam (status code, content-type, fallback do SPA).
      - run: |
          mkdir -p frontend/dist/assets frontend/dist/img
          echo '<!doctype html><html><body><div id="root"></div></body></html>' > frontend/dist/index.html
          printf '\x89PNG\r\n\x1a\n' > frontend/dist/img/logo.png
      - run: uv run alembic upgrade head
        env:
          ARGUS_DB_PATH: /tmp/argus-ci-migration-check.db
      - run: uv run pytest --cov --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml

  # ─── Backend: lint + type-check ────────────────────────────────
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run mypy src

  # ─── Frontend: typecheck, lint, build, tests + coverage gate ───
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage

  # ─── Cyclomatic complexity gate ────────────────────────────────
  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uvx xenon --max-absolute D --max-modules B --max-average B src

  # ─── Duplication gate ───────────────────────────────────────────
  duplication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npx --yes jscpd@5 src frontend/src --threshold 10 --reporters console

  # ─── SCA: dependências Python ────────────────────────────────────
  sca-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uvx pip-audit --path .venv/lib/python3.12/site-packages

  # ─── SCA: dependências frontend ──────────────────────────────────
  sca-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  # ─── Secrets scan ─────────────────────────────────────────────────
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── SBOM ───────────────────────────────────────────────────────
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: anchore/sbom-action@v0.24.0
        with:
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json

  # ─── Abre (e auto-mergeia) o PR develop -> main depois que develop
  # passa verde ─────────────────────────────────────────────────────
  # Só roda em push direto a develop (ou seja, depois que um PR de feature
  # já foi mergeado nela) e só depois que todos os outros jobs passaram
  # (comportamento padrão do `needs`: se algum falhar, este é pulado). O
  # PR criado aqui reaproveita os checks já reportados nesta mesma SHA —
  # main também exige esses status checks, e eles já estão verdes antes
  # mesmo do PR existir, então não trava esperando o GITHUB_TOKEN
  # re-disparar CI (ele não dispara — eventos de PR abertos por
  # GITHUB_TOKEN não cascateiam novos workflow runs, mas os checks da SHA
  # já são reaproveitados pela branch protection do GitHub).
  #
  # `gh pr merge --auto` habilita o auto-merge nativo do GitHub: ele só
  # efetiva o merge quando os status checks obrigatórios da branch
  # protection de `main` reportarem sucesso — como já reportaram (mesma
  # SHA), o merge acontece de imediato, sem esperar um clique manual.
  # Requer "Allow auto-merge" habilitado nas Settings do repositório
  # (Settings → General → Pull Requests) — sem isso, `gh pr merge --auto`
  # falha explicitamente (não faz merge direto como fallback), então o
  # pior caso é "nenhum release automático", nunca um merge sem os checks
  # passarem.
  #
  # IMPORTANTE (achado ao vivo, não é teórico): o push resultante em
  # `main` NÃO dispara o Release sozinho — commits cujo autor é
  # `github-actions[bot]` (o merge feito com GITHUB_TOKEN, mesmo via
  # auto-merge) não cascateiam pra outros workflow runs via `on: push`,
  # restrição de segurança do próprio GitHub contra loop infinito de
  # Actions disparando Actions. Confirmado: PR #18 mergeou sozinho, `main`
  # avançou, e nenhum run de CI nem de Release apareceu pra essa SHA. Por
  # isso a etapa abaixo espera o merge de verdade acontecer e dispara o
  # Release explicitamente via `workflow_dispatch` (que release.yml já
  # aceita) — esse SIM funciona com GITHUB_TOKEN, é um disparo deliberado
  # via API, não um evento em cascata.
  open-pr-to-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs:
      [backend-tests, backend-lint, frontend-tests, complexity, duplication, sca-python, sca-frontend, gitleaks, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Abre (ou reaproveita) o PR develop -> main e habilita auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          if git diff --quiet origin/main..HEAD; then
            echo "develop já está sincronizada com main — nada a fazer."
            exit 0
          fi
          existing=$(gh pr list --repo "${GITHUB_REPOSITORY}" --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -z "${existing}" ]; then
            gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head develop \
              --title "Release: develop -> main" \
              --body "PR automático aberto pelo CI depois que \`develop\` passou verde. Merge automático assim que os checks liberarem (branch protection de \`main\` exige os mesmos gates, já satisfeitos por essa SHA) — dispara o release sozinho, sem precisar de clique manual."
          else
            echo "Já existe PR aberto (#${existing}) develop -> main — garantindo que o auto-merge está habilitado."
          fi
          pr=$(gh pr list --repo "${GITHUB_REPOSITORY}" --base main --head develop --state open --json number --jq '.[0].number')
          # Logo após o `gh pr create`, a API às vezes ainda não terminou de
          # calcular o mergeable state do PR novo e recusa habilitar o
          # auto-merge com "Pull request is in unstable status" (visto ao
          # vivo: falhou nos primeiros ~7s, um retry manual 30s depois
          # funcionou de primeira) — retry com backoff em vez de falhar o
          # job à toa nessa janela transitória.
          enabled=""
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge "${pr}" --repo "${GITHUB_REPOSITORY}" --merge --auto; then
              enabled=1
              break
            fi
            echo "Tentativa ${attempt}/6 de habilitar auto-merge falhou — tentando de novo em 10s."
            sleep 10
          done
          if [ -z "${enabled}" ]; then
            echo "Não deu pra habilitar auto-merge no PR #${pr} depois de 6 tentativas — merge manual."
            exit 1
          fi

          # Espera o merge de verdade acontecer (checks já estavam verdes
          # nessa SHA, então costuma ser questão de segundos) e dispara o
          # Release explicitamente — ver comentário no topo do job pra
          # entender por quê o push em si não basta.
          for attempt in $(seq 1 18); do
            state=$(gh pr view "${pr}" --repo "${GITHUB_REPOSITORY}" --json state --jq '.state')
            if [ "${state}" = "MERGED" ]; then
              echo "PR #${pr} mergeado — disparando o Release em main."
              gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref main
              exit 0
            fi
            sleep 10
          done
          echo "PR #${pr} não mergeou em 3min mesmo com auto-merge habilitado — Release não disparado automaticamente, precisa checar manualmente."
          exit 1
