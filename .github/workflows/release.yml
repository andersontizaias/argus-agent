name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # ─── Decide se este push pra main é uma versão nova ────────────────
  # A versão em pyproject.toml é a fonte de verdade (não uma tag cortada
  # à mão): todo merge pra main passa por aqui, mas só vira release de
  # verdade se essa versão ainda não tiver uma tag — um merge sem bump
  # (docs, chore de CI, etc.) não deve gerar release nem falhar.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
      - name: Lê [project].version do pyproject.toml
        id: version
        run: |
          VERSION=$(python3 -c "
          import re
          text = open('pyproject.toml').read()
          print(re.search(r'^version = \"([^\"]+)\"', text, re.M).group(1))
          ")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Já existe uma tag pra essa versão?
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "v${{ steps.version.outputs.version }} já foi lançada — merge sem bump de versão, nada a fazer."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: uv sync --frozen
      - name: Gerar ARGUS_SECRET_KEY efêmera só para os testes
        run: echo "ARGUS_SECRET_KEY=$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run playwright install --with-deps chromium
      - run: |
          mkdir -p frontend/dist/assets frontend/dist/img
          echo '<!doctype html><html><body><div id="root"></div></body></html>' > frontend/dist/index.html
          printf '\x89PNG\r\n\x1a\n' > frontend/dist/img/logo.png
      - run: uv run alembic upgrade head
        env:
          ARGUS_DB_PATH: /tmp/argus-release-migration-check.db
      - run: uv run pytest --cov

      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run test:coverage
      - name: Build real do frontend (substitui o stub usado nos testes do backend)
        working-directory: frontend
        run: npm run build

      - name: Empacota o tarball da release
        run: |
          STAGE="argus-agent-v${VERSION}"
          mkdir -p "package/$STAGE"
          cp -r src migrations scripts "package/$STAGE/"
          cp alembic.ini pyproject.toml uv.lock README.md README.pt-BR.md LICENSE .env.example "package/$STAGE/"
          mkdir -p "package/$STAGE/frontend"
          cp -r frontend/dist "package/$STAGE/frontend/dist"
          # __pycache__/.pyc ficam pra trás dos passos de teste/lint acima —
          # bytecode compilado não pertence a um tarball de distribuição.
          find "package/$STAGE" -type d -name "__pycache__" -prune -exec rm -rf {} +
          find "package/$STAGE" -type f -name "*.pyc" -delete
          tar -czf "argus-agent-v${VERSION}.tar.gz" -C package "$STAGE"

      - name: Cria e publica a tag
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Cria a GitHub Release
        run: |
          gh release create "v${VERSION}" \
            "argus-agent-v${VERSION}.tar.gz" \
            "scripts/install.sh" \
            --title "Argus Agent v${VERSION}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Instalador .pkg/.dmg (wizard visual) ──────────────────────────
  # Job à parte, em macos-latest: pkgbuild/productbuild/hdiutil só existem
  # no macOS. Não depende do tarball do job acima (o .pkg não carrega o
  # código da app — o postinstall baixa a release mais recente sozinho,
  # ver packaging/macos/README.md) — só precisa que a release já exista
  # pra anexar o .dmg nela.
  installer:
    needs: [check-version, release]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: packaging/macos/build-pkg.sh "${{ needs.check-version.outputs.version }}"
      - run: packaging/macos/build-dmg.sh
      - name: Anexa o .dmg na release já criada
        run: gh release upload "v${{ needs.check-version.outputs.version }}" packaging/macos/build/ArgusAgent-Installer.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
